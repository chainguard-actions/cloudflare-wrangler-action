name: Test secrets, vars, and gitHubToken inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_VALUE: "super-secret-value"
      MY_VAR_VALUE: "my-var-value"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apiToken: "fake-api-token-for-input-coverage"
          accountId: "fake-account-id-for-input-coverage"
          gitHubToken: ${{ github.token }}
          secrets: |
            MY_SECRET_VALUE
          vars: |
            MY_VAR_VALUE
          command: "whoami"
        env:
          MY_SECRET_VALUE: "super-secret-value"
          MY_VAR_VALUE: "my-var-value"
      - name: Assert action ran (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STDOUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "stdout: $STDOUT"
          echo "stderr: $STDERR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
