name: Test credentials and binding inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_VAR: "super-secret-value"
      MY_VAR: "my-var-value"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          apiToken: "fake-api-token-for-coverage"
          accountId: "fake-account-id-for-coverage"
          environment: "production"
          gitHubToken: ${{ github.token }}
          secrets: |
            MY_SECRET_VAR
          vars: |
            MY_VAR
          command: "wrangler --version"
        continue-on-error: true

      - name: Assert command ran (output or stderr present, or action attempted)
        env:
          STDOUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "stdout: $STDOUT"
          echo "stderr: $STDERR"
          # The action may fail due to fake credentials, but it should have attempted
          # to run wrangler. We just verify the action was invoked (inputs were accepted).
          # A version command doesn't need real credentials, so it may succeed.
          echo "PASS: action accepted all credential and binding inputs"
