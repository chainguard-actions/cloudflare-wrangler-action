name: Test credentials and environment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apiToken: "fake-api-token-for-input-coverage"
          accountId: "fake-account-id-for-input-coverage"
          environment: "production"
          command: "whoami"
      - name: Assert action ran (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STDOUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "stdout: $STDOUT"
          echo "stderr: $STDERR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
