name: Test pre and post commands execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: --version
          preCommands: echo "pre_ran" > /tmp/pre_marker.txt
          postCommands: echo "post_ran" > /tmp/post_marker.txt
        env:
          CLOUDFLARE_API_TOKEN: fake-token-for-testing
      - name: Assert pre-command ran
        run: |
          if [ ! -f /tmp/pre_marker.txt ]; then
            echo "FAIL: pre_marker.txt not found - pre-command did not run"
            exit 1
          fi
          CONTENT=$(cat /tmp/pre_marker.txt)
          echo "pre marker content: $CONTENT"
          if [ "$CONTENT" != "pre_ran" ]; then
            echo "FAIL: expected 'pre_ran', got: $CONTENT"
            exit 1
          fi
          echo "PASS: pre-command ran successfully"
      - name: Assert post-command ran
        run: |
          if [ ! -f /tmp/post_marker.txt ]; then
            echo "FAIL: post_marker.txt not found - post-command did not run"
            exit 1
          fi
          CONTENT=$(cat /tmp/post_marker.txt)
          echo "post marker content: $CONTENT"
          if [ "$CONTENT" != "post_ran" ]; then
            echo "FAIL: expected 'post_ran', got: $CONTENT"
            exit 1
          fi
          echo "PASS: post-command ran successfully"
