name: Test quiet mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: --version
          quiet: "true"
        continue-on-error: true
      - name: Assert action ran in quiet mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CMD_OUTPUT: ${{ steps.action.outputs.command-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-output: $CMD_OUTPUT"
          # The action should run (succeed or fail gracefully) in quiet mode
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in quiet mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in quiet mode (acceptable without credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
