name: Test quiet mode suppresses output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: version
          quiet: "true"
      - name: Assert action succeeded in quiet mode
        env:
          OUTPUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "command-output: $OUTPUT"
          echo "command-stderr: $STDERR"
          # In quiet mode the action should still succeed and capture output
          # The output may be empty (suppressed) or contain version info
          echo "PASS: action completed in quiet mode without error"
