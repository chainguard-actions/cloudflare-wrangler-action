name: Test specific wrangler version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: --version
          wranglerVersion: "3.99.0"
        env:
          CLOUDFLARE_API_TOKEN: fake-token-for-testing
      - name: Assert command-output contains expected version
        env:
          ACTUAL: ${{ steps.action.outputs.command-output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command-output to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "3.99.0"; then
            echo "FAIL: expected version 3.99.0 in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: correct wrangler version installed and reported"
