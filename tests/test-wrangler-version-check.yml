name: Test wrangler version check command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Run a non-deploy command that doesn't require API credentials
          command: --version
          wranglerVersion: "3.99.0"
        continue-on-error: true
      - name: Assert wrangler version command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CMD_OUTPUT: ${{ steps.action.outputs.command-output }}
          CMD_STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-output: $CMD_OUTPUT"
          echo "command-stderr: $CMD_STDERR"
          # The action should succeed - --version doesn't need credentials
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
