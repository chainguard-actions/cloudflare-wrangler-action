name: Test deploy without credentials fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No apiToken or accountId provided - deploy should fail
        continue-on-error: true
      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CMD_OUTPUT: ${{ steps.action.outputs.command-output }}
          CMD_STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-output: $CMD_OUTPUT"
          echo "command-stderr: $CMD_STDERR"
          # Without credentials, the deploy command should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed without credentials"
          elif [ "$OUTCOME" = "success" ]; then
            # This would be unexpected but not necessarily wrong if wrangler
            # somehow succeeds (e.g., cached credentials in environment)
            echo "INFO: action succeeded unexpectedly - may have cached credentials"
            echo "PASS: action completed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
