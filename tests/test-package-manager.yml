name: Test explicit package manager selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: --version
          packageManager: npm
        env:
          CLOUDFLARE_API_TOKEN: fake-token-for-testing
      - name: Assert command-output contains version
        env:
          ACTUAL: ${{ steps.action.outputs.command-output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command-output to be non-empty when using npm package manager"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qiE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected version string in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: wrangler installed and ran via npm"
