name: Test wrangler v1 is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          wranglerVersion: "1.21.0"
          command: --version
        continue-on-error: true
      - name: Assert action failed with v1 rejection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because wrangler v1 is not supported
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected wrangler v1"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected wrangler v1 but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
