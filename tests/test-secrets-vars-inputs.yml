name: Test secrets and vars inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_VALUE: "test-secret-value"
      MY_VAR_VALUE: "test-var-value"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apiToken: "fake-token-for-input-coverage"
          accountId: "fake-account-id-for-input-coverage"
          command: deploy
          secrets: |
            MY_SECRET_VALUE
          vars: |
            MY_VAR_VALUE
        env:
          MY_SECRET_VALUE: "test-secret-value"
          MY_VAR_VALUE: "test-var-value"
      - name: Assert action ran with secrets and vars inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-stderr: $STDERR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with secrets and vars inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
