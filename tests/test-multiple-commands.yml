name: Test multiple wrangler commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: |
            --version
            --version
        env:
          CLOUDFLARE_API_TOKEN: fake-token-for-testing
      - name: Assert command-output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.command-output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command-output to be non-empty after running multiple commands"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qiE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected version string in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: multiple commands ran and produced output"
