name: Test auth inputs (apiToken, accountId, environment)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apiToken: "fake-token-for-input-coverage"
          accountId: "fake-account-id-for-input-coverage"
          environment: "production"
          command: version
      - name: Assert action ran with auth inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-output: $OUTPUT"
          echo "command-stderr: $STDERR"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT" ]; then
              echo "FAIL: action succeeded but command-output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with auth inputs, output: $OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
