name: Test working directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with a marker file
        run: |
          mkdir -p tests/workdir
          echo "marker" > tests/workdir/marker.txt
      - id: action
        uses: .
        with:
          command: --version
          workingDirectory: tests/workdir
        env:
          CLOUDFLARE_API_TOKEN: fake-token-for-testing
      - name: Assert command-output contains version
        env:
          ACTUAL: ${{ steps.action.outputs.command-output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command-output to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qiE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected version string in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: wrangler ran successfully from working directory"
