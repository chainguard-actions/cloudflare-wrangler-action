name: Test workingDirectory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/workdir"
      - id: action
        uses: .
        with:
          command: --version
          workingDirectory: tests/workdir
        continue-on-error: true
      - name: Assert action ran from working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CMD_OUTPUT: ${{ steps.action.outputs.command-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command-output: $CMD_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully from working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable without credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
