name: Test secrets and vars inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_VAR: "hello-from-var"
      MY_SECRET: "secret-value"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apiToken: "fake-api-token-for-coverage"
          accountId: "fake-account-id-for-coverage"
          vars: |
            MY_VAR
          secrets: |
            MY_SECRET
          command: "version"
      - name: Assert action ran with secrets and vars inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STDOUT: ${{ steps.action.outputs.command-output }}
          STDERR: ${{ steps.action.outputs.command-stderr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "stdout: $STDOUT"
          echo "stderr: $STDERR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Cloudflare credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
